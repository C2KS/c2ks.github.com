<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CR4NK - Games & Roadmap</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            line-height: 1.6;
        }

        nav {
            background-color: #1a1a1a;
            padding: 1rem 2rem;
            display: flex;
            justify-content: flex-start;
            gap: 2rem;
            border-bottom: 2px solid #2a2a2a;
        }

        nav a {
            color: #aaaaaa;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        nav a:hover, nav a.active {
            color: #ffffff;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        h1 {
            font-family: 'Agency FB', 'Arial Black', sans-serif;
            font-size: 3rem;
            color: #ffffff;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        h2 {
            font-family: 'Agency FB', 'Arial Black', sans-serif;
            font-size: 2rem;
            margin-top: 2.5rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-left: 0.75rem;
        }

        .hl2d-title {
            color: #F7931E; 
            border-left: 4px solid #F7931E;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 3.5rem;
        }

        .game-card {
            position: relative;
            border: 1px solid #333333;
            border-radius: 8px;
            overflow: hidden;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: #F7931E; /* Half-Life Orange Outline on Hover */
        }

        .game-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: brightness(0.25) contrast(1.1) saturate(0.8); 
            z-index: 1;
            transition: filter 0.3s ease;
        }

        .game-card:hover::before {
            filter: brightness(0.4) contrast(1.15) saturate(1);
        }

        /* Using your existing background image token from the original card */
        .card-hl2d::before { background-image: url('image_jaCqGO.png'); }

        .game-card-content {
            position: relative;
            z-index: 2;
            width: 100%;
        }

        .game-card h3 {
            font-family: 'Agency FB', 'Arial Black', sans-serif;
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 5px rgba(0,0,0,0.95);
            letter-spacing: 1px;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            background-color: #222222;
            color: #aaaaaa;
            border: 1px solid #444444;
        }

        .engine-info {
            font-size: 0.85rem;
            color: #888888;
            background: rgba(0, 0, 0, 0.65);
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .engine-info strong {
            color: #e0e0e0;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="#" class="active">Games</a>
        <a href="engines.html">Engines</a>
        <a href="team.html">Team</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main class="container">
        
        <h1>My Games & Roadmap</h1>

        <section class="hl2d-group">
            <h2 class="hl2d-title">Half-Life 2D Series</h2>
            <div class="games-grid">
                
                <div class="game-card card-hl2d">
                    <div class="game-card-content">
                        <span class="status-badge">Planned</span>
                        <h3>Half-Life 2D</h3>
                        <p>A thrilling top-down tribute and throwback to the legendary 1998 Half-Life universe.</p>
                        <div class="engine-info">Engine: <strong>Geared 2</strong></div>
                    </div>
                </div>

            </div>
        </section>

    </main>
</body>
</html>
