<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cool Website</title>
    <style>
        /* This section is CSS - it makes the top tabs look like real buttons */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
        }

        /* The container for the top menu */
        .navbar {
            background-color: #333;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        /* The individual tabs/buttons */
        .navbar a {
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
        }

        /* This makes the buttons change color when you hover over them */
        .navbar a:hover {
            background-color: #555;
            color: #4caf50;
        }

        /* The main section of your page */
        .content {
            padding: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- This creates the tabs at the top of your page -->
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="games.html">Games</a>
        <a href="contact.html">Contact</a>
    </div>

    <!-- This is the main text on your Home page -->
    <div class="content">
        <h1>Welcome to My Website!</h1>
        <p>This is the Home page. Use the tabs above to look around.</p>
    </div>

</body>
</html>
